<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (function () {
        var stored = localStorage.getItem("mg-theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <title>Projects - Palak</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/projects.css">
</head>
<body>
    <div id="global-header"></div>
    <main>
        <h1 class="page-title">Projects</h1>
        <hr>
        <div class="project-tabs">
            <button class="tab-btn active" data-target="course-projects.html">Course Projects</button>
            <button class="tab-btn" data-target="research-projects.html">Research Projects</button>
            <button class="tab-btn" data-target="programming-projects.html">Programming Projects</button>
        </div>
        <hr>
        <div id="project-content">
            <!-- Content will be dynamically loaded here by projects.js -->
            <p>Loading projects...</p>
        </div>
    </main>
    <div id="global-footer"></div>
    <script src="js/components.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
